<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quant Master — Nathalie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #050A0E; font-family: 'DM Sans', sans-serif; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #050A0E; }
      ::-webkit-scrollbar-thumb { background: #1A3A5C; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #2A5A8C; }
      input[type=number]::-webkit-inner-spin-button { opacity: 0.5; }
      button { transition: opacity 0.15s ease; }
      button:hover { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
